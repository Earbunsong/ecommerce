name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopkh
          POSTGRES_PASSWORD: shopkh
          POSTGRES_DB: shopkh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopkh -d shopkh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://shopkh:shopkh@localhost:5432/shopkh_test
      JWT_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
